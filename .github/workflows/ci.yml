name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (corpus, retrieval, PII rail, obligations)
        run: npm test
      - name: Retrieval regression gate (BM25, deterministic)
        run: npm run evals:retrieval
      - name: Assessment regression gate (replay of committed fixtures)
        run: npx tsx evals/run.ts --replay
      - name: Injection-probe regression gate (replay of committed fixtures)
        run: npx tsx evals/probes.ts --replay
      - name: Build
        run: npm run build
